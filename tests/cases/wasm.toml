    { name = "module_config.log_ring-full-lines-dropped", in = "module_config.log_ring-full-lines-dropped", claims = { matches = ["line 11 0.*test:chatty@0.1.0/-: 88 log lines were dropped: its ring holds 12.*alive"] }, false = "module_config.log_ring-room-for-every-line" },
