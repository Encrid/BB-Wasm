code = ["include/**", "src/**", "tests/**", "tools/**", ".toolchain/config/**", ".toolchain/project.toml"]

[[case]]
name = "call-a-thread-with-too-little-stack-refused"
process = "state"
run = ["{out}/wasm-host{exe}", "call-a-thread-with-too-little-stack-refused"]
claims = { matches = ["game:ticker@0\\.1\\.0/advance: system 'advance' failed: did not run: the thread has \\d+ bytes of stack left, and max_wasm_stack and stack_margin need 589824.*alive"] }
false = { run = ["{out}/wasm-host{exe}", "call-a-thread-with-enough-stack-runs"] }

[[case]]
name = "call-a-thread-with-enough-stack-runs"
process = "state"
run = ["{out}/wasm-host{exe}", "call-a-thread-with-enough-stack-runs"]
claims = { matches = ["game:ticker@0\\.1\\.0/advance: tick 101 1.*alive"], lacks = ["did not run"] }
false = { run = ["{out}/wasm-host{exe}", "call-a-thread-with-too-little-stack-refused"] }

[[case]]
name = "BRIDGE_ROW-no-call-in-the-loop"
process = "command"
run = ["{wasm_dis}", "{out}/wasm/mover.wasm", "{features}"]
claims = { matches = ["\\(module"], lacks = ["acc_"] }
false = { run = ["{wasm_dis}", "{out}/obj/mover.raw.wasm", "{features}"] }

[[case]]
name = "BRIDGE_ACC-the-accessors-merged-in"
process = "command"
run = ["{wasm_dis}", "{out}/wasm/mover.wasm", "{features}"]
claims = { matches = ["\\(module"], lacks = ["acc_"] }
false = { run = ["{wasm_dis}", "{out}/obj/mover.raw.wasm", "{features}"] }

[[case]]
name = "simd-a-loop-over-its-own-memory-vectorized"
process = "command"
run = ["{wasm_dis}", "{out}/wasm/vector.wasm", "{features}"]
claims = { matches = ["i32x4\\.add"] }
false = { run = ["{wasm_dis}", "{out}/wasm/vector-scalar.wasm", "{features}"] }

[[case]]
name = "isolate.imports-shared-memory-refused-at-build"
process = "command"
run = ["{python}", "{root}/tools/wasm_guard.py", "{out}/wasm/importsshared.wasm"]
claims = { status = 1, has = ["is refused: it imports the memory 'bridge.shared'"] }
false = { run = ["{python}", "{root}/tools/wasm_guard.py", "{out}/obj/mover.raw.wasm"] }

[[case]]
name = "isolate.imports-a-tag-refused-at-build"
process = "command"
run = ["{python}", "{root}/tools/wasm_guard.py", "{out}/wasm/importstag.wasm"]
claims = { status = 1, has = ["is refused: it imports the tag 'env.boom'; a module imports no tag"] }
false = { run = ["{python}", "{root}/tools/wasm_guard.py", "{out}/wasm/strayglobal.wasm"] }

[[case]]
name = "isolate.imports-a-global-refused-at-build"
process = "command"
run = ["{python}", "{root}/tools/wasm_guard.py", "{out}/wasm/strayglobal.wasm"]
claims = { status = 1, has = ["is refused: it imports the global 'elsewhere.number'; a module imports no global"] }
false = { run = ["{python}", "{root}/tools/wasm_guard.py", "{out}/wasm/importstag.wasm"] }

[[case]]
name = "wasm-host"
run = ["{out}/wasm-host{exe}"]
sweep = ["calloc", "malloc", "os_commit", "os_event_create", "os_mutex_create", "os_reserve", "os_thread_stack_left", "os_thread_start"]
claims = { status = 0 }
rows = [
    { name = "bridge_load-loaded", in = "bridge_load-loaded", claims = { matches = ["test:ok@0.1.0: loaded.*alive"] }, false = "module_config.memory_limit-memory-larger-at-start" },
    { name = "BRIDGE_NO_LIMIT-stated-for-every-limit", in = "BRIDGE_NO_LIMIT-stated-for-every-limit", claims = { matches = ["test:ok@0.1.0: loaded.*alive"] }, false = "BRIDGE_NO_LIMIT-but-one-limit-none-refused" },
    { name = "bridge_load-memory-with-a-data-segment", in = "bridge_load-memory-with-a-data-segment", claims = { matches = ["test:image@0.1.0: loaded.*alive"] }, false = "bridge_load-memory-without-a-data-segment" },
    { name = "bridge_load-init-trapped", in = "bridge_load-init-trapped", claims = { matches = ["module 'test:oob@0.1.0' did not load: its init trapped: out of bounds memory access.*alive"] }, false = "bridge_load-init-in-bounds" },
    { name = "module_config.init_timeout-init-interrupted", in = "module_config.init_timeout-init-interrupted", claims = { matches = ["module 'test:spin@0.1.0' did not load: its init trapped: interrupt.*alive"] }, false = "module_config.init_timeout-init-that-ends-in-time" },
    { name = "module_config.memory_limit-growth-refused", in = "module_config.memory_limit-growth-refused", claims = { matches = ["module 'test:grow@0.1.0' did not load: its init answered 7.*alive"] }, false = "module_config.memory_limit-growth-within-the-limit" },
    { name = "module_config.memory_limit-memory-larger-at-start", in = "module_config.memory_limit-memory-larger-at-start", claims = { matches = ["module 'test:big@0.1.0' did not load: its init made no instance.*alive"] }, false = "bridge_load-loaded" },
    { name = "instance_get_func-export-taking-an-argument-refused", in = "instance_get_func-export-taking-an-argument-refused", claims = { matches = ["module 'test:shape@0.1.0' did not load: its export 'init' is not .. -> i32.*alive"] }, false = "instance_get_func-export-init-without-arguments" },
    { name = "instance_get_func-export-answering-64-bits-refused", in = "instance_get_func-export-answering-64-bits-refused", claims = { matches = ["module 'test:shape64@0.1.0' did not load: its export 'init' is not .. -> i32.*alive"] }, false = "instance_get_func-export-init-without-arguments" },
    { name = "bridge_load-no-init-export", in = "bridge_load-no-init-export", claims = { matches = ["module 'test:noinit@0.1.0' did not load: no exported function 'init'.*alive"] }, false = "instance_get_func-export-init-without-arguments" },
    { name = "module_config.abi-another-refused", in = "module_config.abi-another-refused", claims = { matches = ["module 'test:ok@0.1.0' is refused: it wants ABI 2 and this is ABI 1.*alive"] }, false = "module_config.abi-this-one-loaded" },
    { name = "artifact.backend-not-configured-refused", in = "artifact.backend-not-configured-refused", claims = { matches = ["module 'test:ok@0.1.0' is refused: no backend named 'native'.*alive"] }, false = "artifact.backend-a-configured-one-loaded" },
    { name = "module_config.log_level-unset-refused", in = "module_config.log_level-unset-refused", claims = { matches = ["module 'test:ok@0.1.0' is refused: log_level is unset.*alive"], lacks = [": loaded"] }, false = "bridge_load-loaded" },
    { name = "module_config.memory_limit-unset-refused", in = "module_config.memory_limit-unset-refused", claims = { matches = ["module 'test:ok@0.1.0' is refused: memory_limit is unset.*alive"] }, false = "bridge_load-loaded" },
    { name = "BRIDGE_NONE-for-a-limit-refused", in = "BRIDGE_NONE-for-a-limit-refused", claims = { matches = ["module 'test:ok@0.1.0' is refused: spawns is -1, which is neither an amount nor BRIDGE_NONE.*module 'test:ok@0.1.0' is refused: work_limit is -2, which is neither a limit nor BRIDGE_NO_LIMIT.*alive"], lacks = [": loaded"] }, false = "BRIDGE_NO_LIMIT-for-a-limit-loaded" },
    { name = "config.abi-another-refused", in = "config.abi-another-refused", claims = { matches = ["the host is of host ABI 2, and this is 1.*bridge_create refused.*alive"] }, false = "config.abi-this-one-created" },
    { name = "config.abi-unset-refused", in = "config.abi-unset-refused", claims = { matches = ["abi is unset.*bridge_create refused.*alive"] }, false = "BRIDGE_HOST_ABI-stated-and-created" },
    { name = "BRIDGE_UNSET-flag-refused", in = "BRIDGE_UNSET-flag-refused", claims = { matches = ["module 'test:ok@0.1.0' is refused: pinned is unset.*module 'test:ok@0.1.0' is refused: hot_reload is 3, which is neither BRIDGE_TRUE nor BRIDGE_FALSE.*alive"], lacks = [": loaded"] }, false = "module_config.pinned-stated-loaded" },
    { name = "module_config.memory_limit-negative-refused", in = "module_config.memory_limit-negative-refused", claims = { matches = ["module 'test:ok@0.1.0' is refused: memory_limit is -7, which is neither a limit nor BRIDGE_NO_LIMIT.*alive"], lacks = [": loaded"] }, false = "bridge_load-loaded" },
    { name = "module_config.on_error-fail-stops-and-skip-does-not", in = "module_config.on_error-fail-stops-and-skip-does-not", claims = { matches = ["test:ok@0.1.0: loaded.*the world has stopped: module 'test:oob@0.1.0' failed and its on_error is fail.*test:ok@0.1.0: not loaded.*alive"] }, false = "module_config.on_error-skip-twice-stops-nothing" },
    { name = "backend.library-cannot-open-refused", in = "backend.library-cannot-open-refused", claims = { matches = ["backend 'wasm': cannot open backend library 'no-such-backend-library'.*bridge_create refused.*alive"] }, false = "backend.library-the-configured-one-opened" },
    { name = "bridge_create-no-sink-refused", in = "bridge_create-no-sink-refused", claims = { matches = ["refused: no sink.*alive"] }, false = "bridge_create-a-sink-created" },
    { name = "module_config.read-another-namespace-read", in = "module_config.read-another-namespace-read", claims = { matches = ["sum 250500 0.*moved 2 1000.*sum 251000 0.*sum 251500 0.*alive"] }, false = "module_config.read-one-of-two-named-refused" },
    { name = "bridge_get_span-one-table-walked", in = "bridge_get_span-one-table-walked", claims = { matches = ["view:reader@0.1.0/sum: saw 1 500.*game:mover@0.1.0/count: moved 2 1000.*alive"] }, false = "bridge_get_span_count-two-tables-matched" },
    { name = "record.level-info-with-its-two-numbers", in = "record.level-info-with-its-two-numbers", claims = { matches = ["record.6. view:reader@0.1.0/sum: sum 250500 0.*alive"] }, false = "record.level-warn-with-its-two-numbers" },
    { name = "bridge_get_ref-own-entities-followed", in = "bridge_get_ref-own-entities-followed", claims = { matches = ["mirror 100 0.*mirror 100 0.*mirror 100 0.*alive"] }, false = "bridge_get_location-two-frames-followed" },
    { name = "declare-storage-unset-refused", in = "declare-storage-unset-refused", claims = { matches = ["module 'game:kept@0.1.0' did not load: type 'game:Position': its storage layout is unset.*module 'game:kept@0.1.0' did not load: type 'game:Position' is stated as a sparse set here, and it was declared as a table. It is also declared by 'game:mover@0.1.0'.*alive"] }, false = "declare-storage-stated-loaded" },
    { name = "BRIDGE_DIRECT_INDEXED-reached-from-rows", in = "BRIDGE_DIRECT_INDEXED-reached-from-rows", claims = { matches = ["game:aim@0.1.0/reached: aims 10 5.*game:aim@0.1.0/reached: aimed 20 0.*alive"], lacks = ["did not load"] }, false = "BRIDGE_DIRECT_INDEXED-every-third-reached" },
    { name = "BRIDGE_TOGGLE-counted-on-and-off", in = "BRIDGE_TOGGLE-counted-on-and-off", claims = { matches = ["game:shield@0.1.0/count: shields 10 10.*game:shield@0.1.0/count: strength 45 0.*game:shield@0.1.0/count: shields 10 6.*game:shield@0.1.0/count: strength 27 0.*alive"], lacks = ["did not load"] }, false = "BRIDGE_TOGGLE-every-second-turned-off" },
    { name = "BRIDGE_SPARSE_SET-walked-and-reached", in = "BRIDGE_SPARSE_SET-walked-and-reached", claims = { matches = ["game:hit@0.1.0/walked: hits 4 18.*game:hit@0.1.0/reached: bodies 10 4.*game:hit@0.1.0/reached: reached 18 0.*alive"], lacks = ["did not load"] }, false = "BRIDGE_SPARSE_SET-every-second-walked" },
    { name = "declare-another-layout-refused", in = "declare-another-layout-refused", claims = { matches = ["module 'game:fp@0.1.0' did not load: type 'game:Position' has another component layout here: fingerprint [0-9a-f]+, and it was declared with [0-9a-f]+. It is also declared by 'game:mover@0.1.0'.*alive"] }, false = "declare-the-same-layout-loaded" },
    { name = "declare-ungranted-namespace-refused", in = "declare-ungranted-namespace-refused", claims = { matches = ["module 'view:reader@0.1.0' did not load: it may not declare 'game:Position': that is another namespace's, and no grant names it.*alive"] }, false = "declare-granted-namespace-loaded" },
    { name = "add_system-unknown-operator-refused", in = "add_system-unknown-operator-refused", claims = { matches = ["module 'game:badterm@0.1.0' did not load: term 0 of system 'any': its operator is 4, and there are three.*alive"] }, false = "add_system-the-last-operator-loaded" },
    { name = "bridge_lend-scratch-given-back", in = "bridge_lend-scratch-given-back", claims = { matches = ["game:mover@0.1.0: loaded.*moved.*alive"], lacks = ["not loaded"] }, false = "bridge_take_scratch-more-than-given-stops-the-module" },
    { name = "module_config.work_limit-spinning-system-ended", in = "module_config.work_limit-spinning-system-ended", claims = { matches = ["test:spin@0.1.0/forever: system 'forever' failed: trapped: all fuel consumed.*still here.*all fuel consumed.*still here.*alive"] }, false = "module_config.work_limit-a-system-that-ends-in-time" },
