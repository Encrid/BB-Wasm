[leaks]
with = ["{bridge_os}/leaks.toml"]

[leaks.pairs]
wasmtime_store_new = "wasmtime_store_delete"
wasmtime_linker_new = "wasmtime_linker_delete"

[leaks.kinds.wasmtime_error]
takes = { wasmtime_error_new = "result", wasmtime_module_new = "result", wasmtime_context_set_fuel = "result", wasmtime_linker_define = "result", wasmtime_linker_define_func_unchecked = "result", wasmtime_linker_instantiate = "result", wasmtime_instance_new = "result", wasmtime_func_call = "result" }
gives = { wasmtime_error_delete = "1", make_memory = "result", grow_adopted = "result", grow_own = "result" }

[leaks.kinds.wasm_trap]
takes = { wasmtime_trap_new = "result", wasmtime_instance_new = "*6", wasmtime_linker_instantiate = "*5", wasmtime_func_call = "*7" }
gives = { wasm_trap_delete = "1", wasm_call_offered = "result" }

[leaks.kinds.wasmtime_module]
takes = { wasmtime_module_new = "*4" }
gives = { wasmtime_module_delete = "1" }

[leaks.kinds.wasm_byte_vec]
takes = { wasmtime_error_message = "*2", wasm_trap_message = "*2" }
gives = { wasm_byte_vec_delete = "*1" }

[leaks.kinds.wasm_importtype_vec]
takes = { wasmtime_module_imports = "*2" }
gives = { wasm_importtype_vec_delete = "*1" }

[leaks.kinds.wasm_exporttype_vec]
takes = { wasmtime_module_exports = "*2" }
gives = { wasm_exporttype_vec_delete = "*1" }

[leaks.kinds.wasm_valtype_vec]
takes = { wasm_valtype_vec_new_uninitialized = "*1" }
gives = { wasm_functype_new = ["*1", "*2"] }

[leaks.kinds.wasm_functype]
takes = { wasm_functype_new = "result" }
gives = { wasm_functype_delete = "1" }

[leaks.kinds.wasm_config]
takes = { wasm_config_new = "result" }
gives = { wasm_engine_new_with_config = "1" }

[leaks.kinds.wasm_engine]
takes = { wasm_engine_new_with_config = "result" }
gives = { wasm_engine_delete = "1" }

[leaks.kinds.wasmtime_extern]
takes = { wasmtime_instance_export_get = "*5" }
gives = { wasmtime_extern_delete = "*1" }
