[[artifact]]
name = "bridge_wasm"
kind = "library"
folder = "backends"
sources = ["src/*.c"]
link = ["{bridge_os}/os.a"]
include = ["{bridge}/include", "src", "{bridge_os}/include", "{wasmtime}/include"]
flags = ["{quiet}", "{system_defines}", "{wasmtime_link}", "{system_libraries}", "{rpath}"]
beside = ["{wasmtime}/{wasmtime_runtime}"]

[[artifact]]
name = "wasm-host"
kind = "program"
test = true
sources = ["tests/host/*.c", "tests/support/host*.c", "tests/support/{system}/host*.c"]
include = ["{bridge}/include", "tests/host", "tests/support"]
defines = ['BACKEND_PATH="{out}/backends/bridge_wasm{library}"', 'MODULE_DIR="{out}/wasm"']
flags = ["{quiet}", "{system_defines}", "{system_libraries}"]
link = ["{bridge}/bridge{library}"]
beside = ["{bridge}/bridge{library}"]

[[artifact]]
name = "wasm-adopt"
kind = "program"
test = true
sources = ["tests/adopt/*.c"]
include = ["{bridge}/include", "{bridge_os}/include", "tests/adopt"]
defines = ['BACKEND_PATH="{out}/backends/bridge_wasm{library}"', 'MODULE_DIR="{out}/wasm"']
flags = ["{quiet}", "{system_defines}", "{system_libraries}"]
link = ["{bridge_os}/os.a"]

